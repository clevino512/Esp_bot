version: '3.9'

# =============================================================
# UniBot ESPA — Docker Compose PRODUCTION
# Serveur interne ESPA — HTTPS + Nginx reverse proxy
# =============================================================

services:

  # -----------------------------------------------------------
  # NGINX — Reverse Proxy + Terminaison HTTPS
  # -----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: unibot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - unibot_net

  # -----------------------------------------------------------
  # BACKEND — FastAPI Production
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: unibot_backend
    restart: always
    expose:
      - "8000"
    volumes:
      - ./knowledge-base:/app/knowledge-base:ro
      - backend_models:/app/.cache
      - backend_logs:/app/logs
    env_file:
      - .env.prod
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unibot_net
    command: >
      gunicorn main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile /app/logs/access.log
      --error-logfile /app/logs/error.log
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G

  # -----------------------------------------------------------
  # FRONTEND — Build statique servi par Nginx
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_BASE_URL=https://unibot.espa.mg/api
    container_name: unibot_frontend_build
    volumes:
      - frontend_build:/app/dist
    networks:
      - unibot_net
    command: ["sh", "-c", "cp -r /app/dist/* /shared/ && echo 'Build copied'"]

  # -----------------------------------------------------------
  # CHROMADB — Production
  # -----------------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: unibot_chromadb
    restart: always
    expose:
      - "8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
      - IS_PERSISTENT=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - unibot_net
    deploy:
      resources:
        limits:
          memory: 2G

  # -----------------------------------------------------------
  # POSTGRESQL — Production
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: unibot_postgres
    restart: always
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - unibot_net

  # -----------------------------------------------------------
  # REDIS — Production
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: unibot_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - unibot_net

volumes:
  chromadb_data:
  postgres_data:
  postgres_backups:
  redis_data:
  backend_models:
  backend_logs:
  frontend_build:

networks:
  unibot_net:
    driver: bridge
